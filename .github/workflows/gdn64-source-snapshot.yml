name: GDN64 source snapshot

on:
  push:
    branches: [codex/gdn64-latest-precision-cuda]
    paths: [.github/workflows/gdn64-source-snapshot.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact upstream sources and all existing fork changes
        shell: bash
        run: |
          set -euo pipefail
          upstream=08618ff8e735141d8e4e5be28e6d6af170e4757b
          fork=c5709247c243a0b1ae299ddb9d8f4c8b0279be89
          git remote add integration-upstream https://github.com/ggml-org/llama.cpp.git
          git fetch --no-tags integration-upstream "$upstream"
          base=$(git merge-base "$fork" "$upstream")
          mkdir -p "$RUNNER_TEMP/gdn64-snapshot/base-blobs"
          git archive "$upstream" | gzip > "$RUNNER_TEMP/gdn64-snapshot/upstream.tar.gz"
          git diff --binary --full-index "$base" "$fork" > "$RUNNER_TEMP/gdn64-snapshot/fork.patch"
          git diff --name-status "$base" "$fork" > "$RUNNER_TEMP/gdn64-snapshot/fork-files.txt"
          printf 'upstream=%s\nfork=%s\nmerge_base=%s\n' "$upstream" "$fork" "$base" > "$RUNNER_TEMP/gdn64-snapshot/refs.txt"
          git diff --raw --no-abbrev "$base" "$fork" | awk '{print $3}' | sort -u | while read -r oid; do
            if [[ "$oid" != 0000000000000000000000000000000000000000 ]]; then
              git cat-file blob "$oid" > "$RUNNER_TEMP/gdn64-snapshot/base-blobs/$oid"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: gdn64-integration-source
          path: ${{ runner.temp }}/gdn64-snapshot/
          retention-days: 1
